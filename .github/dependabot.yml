version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
      time: "03:00"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 15
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "react*"
          - "@types/react*"
          - "@radix-ui/*"
          - "@hookform/*"
          - "lucide-react"
          - "sonner"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@vitejs/plugin-react"
        update-types: ["minor", "patch"]
      tooling-minor-patch:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "typescript"
          - "prettier"
          - "turbo"
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "testcontainers"
          - "@testcontainers/*"
          - "@types/node"
        update-types: ["minor", "patch"]
      cloudflare:
        applies-to: version-updates
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/*"
        update-types: ["minor", "patch"]
      backend:
        applies-to: version-updates
        patterns:
          - "hono"
          - "@hono/*"
          - "drizzle-orm"
          - "drizzle-kit"
          - "better-auth"
          - "@better-auth/*"
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
      time: "03:00"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
