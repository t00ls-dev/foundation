name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run:
          pnpm --filter @t00ls-dev/example-basic-d1 exec playwright install
          --with-deps chromium

      - name: Run checks
        run: pnpm check

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: ${{ secrets.PROD_D1_DATABASE_NAME }}
      HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PROD D1 migrations
        working-directory: examples/basic-d1
        run:
          pnpm exec wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          --env production

      - name: Deploy PROD
        working-directory: examples/basic-d1
        run: pnpm exec wrangler deploy --env production

      - name: Smoke test
        if: env.HEALTH_URL != ''
        run:
          curl --fail --silent --show-error --retry 5 --retry-delay 5
          --retry-all-errors "${HEALTH_URL%/}/health"
