name: Diagnóstico Cloudflare Levi DEV

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levi-dev-cloudflare-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 't00ls-dev/foundation' && github.event_name ==
      'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: levi-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Consultar somente metadados Cloudflare via GET
        run: node .github/scripts/levi-cloudflare-read.mjs
        env:
          LEVI_DIAGNOSTIC_SHA: ${{ github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          LEVI_HYPERDRIVE_ID: ${{ vars.LEVI_HYPERDRIVE_ID }}
          LEVI_DEV_DATABASE_HOST: ${{ vars.LEVI_DATABASE_HOST }}
          LEVI_DEV_DATABASE_NAME: ${{ vars.LEVI_DATABASE_NAME }}
