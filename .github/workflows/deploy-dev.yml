name: Deploy DEV

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.repository == 't00ls-dev/foundation' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.repository.full_name == 't00ls-dev/foundation'
      && github.event.workflow_run.head_repository.full_name ==
      't00ls-dev/foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted workflow validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate CI origin, exact SHA and successful checks job
        id: ci
        run: node .github/scripts/ci-evidence.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DEV D1 migrations
        working-directory: examples/links
        run: pnpm db:migrate:dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy DEV
        working-directory: examples/links
        run: pnpm deploy:dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        env:
          HEALTH_URL: ${{ secrets.DEV_HEALTH_URL }}
        run:
          if [ -n "$HEALTH_URL" ]; then curl --fail --silent --show-error
          --retry 5 --retry-delay 5 --retry-all-errors "${HEALTH_URL%/}/health";
          fi
