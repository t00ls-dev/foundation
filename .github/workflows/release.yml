name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description:
          Audit only, explicitly publish, or resume an authorized partial
          release
        type: choice
        options: [audit, publish, resume]
        default: audit
        required: true
      release_pr:
        description: Merged Version Packages PR number
        type: string
        required: true
      release_sha:
        description: Immutable merge commit SHA of the Version Packages PR
        type: string
        required: true
      execution_sha:
        description: Full current master SHA containing the authorized executor
        type: string
        required: true
      confirmation:
        description: Publish/resume require PUBLISH_PRIVATE_FOUNDATION_PACKAGES
        type: string
        required: false
      plan_digest:
        description: Exact digest shown by the successful audit
        type: string
        required: false
      audit_run:
        description: Successful audit run ID owning the approved artifacts
        type: string
        required: false

permissions: {}

# Serialize versioning, audit and publication; never cancel a running publish.
concurrency:
  group: foundation-private-release
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'audit'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
      actions: read
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_PR: ${{ inputs.release_pr }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXECUTION_SHA: ${{ inputs.execution_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@t00ls-dev"
      - run: pnpm install --frozen-lockfile
      - name: Validate manual context, merged Release PR and record
        run: node .github/scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build packages for exact audit artifacts
        run: pnpm --filter './packages/*' -r build
      - name: Inspect registry, create exact pack artifacts and print digest
        id: plan
        run:
          node .github/scripts/release.mjs prepare
          "$RUNNER_TEMP/private-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve immutable audit artifacts for later authorization
        uses: actions/upload-artifact@v7.0.1
        with:
          name: foundation-release-${{ steps.plan.outputs.plan_digest }}
          path: ${{ runner.temp }}/private-release/
          if-no-files-found: error
          retention-days: 30

  preflight:
    if:
      github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish' ||
      inputs.mode == 'resume')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
      actions: read
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_PR: ${{ inputs.release_pr }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXECUTION_SHA: ${{ inputs.execution_sha }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
      AUDIT_RUN: ${{ inputs.audit_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@t00ls-dev"
      - run: pnpm install --frozen-lockfile
      - name: Validate current authorization and Release PR again
        run: node .github/scripts/release.mjs context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrieve original audit artifacts, never repack them
        uses: actions/download-artifact@v8.0.1
        with:
          name: foundation-release-${{ inputs.plan_digest }}
          run-id: ${{ inputs.audit_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/private-release
      - name:
          Revalidate SHA, PR, audit provenance, bytes and remaining registry
          plan
        run:
          node .github/scripts/release.mjs prepare
          "$RUNNER_TEMP/private-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-private-release
          path: ${{ runner.temp }}/private-release/
          if-no-files-found: error

  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/master'
          && (inputs.mode == 'publish' || inputs.mode == 'resume')
          && inputs.confirmation == 'PUBLISH_PRIVATE_FOUNDATION_PACKAGES'
          && inputs.execution_sha == github.sha && needs.preflight.result ==
      'success' }}
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: write
      actions: read
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_PR: ${{ inputs.release_pr }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXECUTION_SHA: ${{ inputs.execution_sha }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
      AUDIT_RUN: ${{ inputs.audit_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@t00ls-dev"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-private-release
          path: ${{ runner.temp }}/private-release
      - name:
          Final gates, artifact-only publish without tags, then reconcile (no
          retry)
        run:
          node .github/scripts/release.mjs publish
          "$RUNNER_TEMP/private-release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve reconciliation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: private-release-result
          path: ${{ runner.temp }}/private-release/
          if-no-files-found: warn
