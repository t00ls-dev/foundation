name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Verificações estáticas"
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node e dependências
        uses: ./.github/actions/setup
      - name: Verificar formatação
        run: pnpm format:check
      - name: Verificar lint
        run: pnpm lint
      - name: Verificar tipos
        run: pnpm typecheck

  tests:
    name: "Testes dos pacotes"
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preparar Node e dependências
        uses: ./.github/actions/setup
      - name: Unitários
        run:
          pnpm exec turbo run test --filter='!levi' -- --reporter=default
          --reporter="$GITHUB_WORKSPACE/.github/scripts/vitest-summary.mjs"
        env:
          GITHUB_TEST_SUITE: Unitários
      - name: Integração
        run:
          pnpm exec turbo run test:integration --filter='!levi' --
          --reporter=default
          --reporter="$GITHUB_WORKSPACE/.github/scripts/vitest-summary.mjs"
        env:
          GITHUB_TEST_SUITE: Integração
      - name: Build dos pacotes
        run: pnpm build
      - name: Verificar contratos do workspace
        run: pnpm test:workspace
      - name: Testar operações
        run: pnpm test:operations

  levi-tests:
    name: "Levi: testes e integração"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node e dependências
        uses: ./.github/actions/setup
      - name: Build do Levi
        run: pnpm exec turbo run build --filter=levi
      - name: Testes unitários do Levi
        run: pnpm --filter levi test
      - name: Build do Worker Levi
        run: pnpm --filter levi worker:build
      # Somente containers PostgreSQL sintéticos, sem credenciais persistentes.
      - name: Integração do Levi
        run: pnpm --filter levi test:integration
      - name: Integração do Levi com ACLs restritas
        run: pnpm --filter levi test:integration --runtime-acls
      - name: Testar Worker com ACLs restritas
        run: pnpm --filter levi test:worker --runtime-acls

  levi-e2e:
    name: "Levi E2E (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node e dependências
        uses: ./.github/actions/setup
      - name: Build do Levi
        run: pnpm exec turbo run build --filter=levi
      - name: Instalar Chromium
        run: pnpm --filter levi exec playwright install --with-deps chromium
      - name: "E2E: shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
        run: >-
          pnpm --filter levi test:e2e --runtime-acls --shard=${{
          matrix.shardIndex }}/${{ matrix.shardTotal }}

  checks:
    if: always()
    needs: [static, tests, levi-tests, levi-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7
      - name: Validar todos os jobs obrigatórios
        run: node .github/scripts/ci-checks.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
