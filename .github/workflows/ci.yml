name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run:
          pnpm --filter @t00ls-dev/example-links exec playwright install
          --with-deps chromium

      - name: Run checks
        run: pnpm check
