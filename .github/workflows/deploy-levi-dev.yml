name: Deploy Levi DEV

on:
  workflow_dispatch:
    inputs:
      maintenance_smoke:
        description:
          "Usar capacidade temporária para os seis smokes durante manutenção
          autorizada"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: levi-dev
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 't00ls-dev/foundation' && github.event_name ==
      'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validar CI conjunta e SHA atual sem secrets operacionais
        id: ci
        run: node .github/scripts/ci-evidence.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: validate
    if: >-
      needs.validate.result == 'success' && github.repository ==
      't00ls-dev/foundation' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' && needs.validate.outputs.sha ==
      github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: levi-dev
    steps:
      - name: Exigir autorização administrativa antes de acessar credenciais
        id: readiness
        run: |
          if [ "$DEPLOY_READY" != "true" ]; then
            echo "::error::Deploy Levi DEV bloqueado: LEVI_DEPLOY_READY deve ser true."
            exit 1
          fi
        env:
          DEPLOY_READY: ${{ vars.LEVI_DEPLOY_READY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Compilar Levi e dependências workspace
        id: build
        run: pnpm exec turbo run build --filter=levi
      - name: Revalidar CI, publicar uma vez e conferir versão e bindings
        id: publish
        working-directory: apps/levi
        run: pnpm deploy:dev
        env:
          LEVI_MAINTENANCE_SMOKE: ${{ inputs.maintenance_smoke }}
          LEVI_SMOKE_CAPABILITY:
            ${{ inputs.maintenance_smoke && secrets.LEVI_SMOKE_CAPABILITY || ''
            }}
          GITHUB_TOKEN: ${{ github.token }}
          LEVI_DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
          LEVI_DEV_READY: ${{ vars.LEVI_DEPLOY_READY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEVI_AUTH_SECRET: ${{ secrets.LEVI_AUTH_SECRET }}
          LEVI_ADMIN_EMAIL: ${{ secrets.LEVI_ADMIN_EMAIL }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          LEVI_HYPERDRIVE_ID: ${{ vars.LEVI_HYPERDRIVE_ID }}
          LEVI_DEV_DATABASE_HOST: ${{ vars.LEVI_DATABASE_HOST }}
          LEVI_DEV_DATABASE_NAME: ${{ vars.LEVI_DATABASE_NAME }}
          LEVI_EMAIL_FROM: ${{ vars.LEVI_EMAIL_FROM }}
      - name: Resumir publicação e verificações
        if: always()
        continue-on-error: true
        working-directory: apps/levi
        run: node tools/deploy-summary.mjs
        env:
          SUMMARY_STATUS: ${{ job.status }}
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          LEVI_DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
