<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Entre na sua conta. · Levi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="demo.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#conteudo">Pular para o conteúdo</a>
    <div class="demo" role="region" aria-label="Aviso do protótipo">
      Protótipo de avaliação · dados fictícios · nada é salvo
    </div>
    <header>
      <a class="brand" href="painel.html"><b>L</b>levi</a
      ><small>Gestão de igrejas</small>
    </header>
    <div class="layout">
      <main id="conteudo" class="auth">
        <div class="eyebrow">Primeiros passos</div>
        <h1 tabindex="-1">Entre na sua conta.</h1>
        <section class="card">
          <form class="simulate">
            <div class="field">
              <label
                >Seu e-mail<input type="email" required autocomplete="off"
              /></label>
            </div>
            <div class="field">
              <label
                >Sua senha<input type="password" required autocomplete="off"
              /></label>
            </div>
            <button class="primary">Entrar — simulação</button>
            <p role="status" class="feedback"></p>
          </form>
        </section>
        <a href="onboarding.html">Criar conta</a>
        <footer>Levi · cuidado com pessoas, clareza na gestão.</footer>
      </main>
    </div>
  </body>
</html>
